name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      # Use npm install (not npm ci) for parity with downstream consumer repos
      # that depend on this via github: protocol — their CI hits ours through
      # cross-org workflows, and ci's strict integrity hash check is brittle
      # against GitHub's tag-tarball regeneration.
      - run: npm install --no-audit --no-fund

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
